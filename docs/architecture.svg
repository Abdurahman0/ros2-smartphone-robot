2"/><text x="447.5" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#2b8a4a">slam_toolbox</text><text x="447.5" y="444" text-anchor="middle" font-size="12.5" fill="#5a6070">scan matching</text><text x="447.5" y="461" text-anchor="middle" font-size="12.5" fill="#5a6070">loop closure</text><text x="447.5" y="478" text-anchor="middle" font-size="12.5" fill="#5a6070">-&gt; /map, map-&gt;odom</text><rect x="600" y="400" width="235" height="104" rx="9" fill="#ffffff" stroke="#2b8a4a" stroke-width="2"/><text x="717.5" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#2b8a4a">Navigation2</text><text x="717.5" y="444" text-anchor="middle" font-size="12.5" fill="#5a6070">global: NavFn plan</text><text x="717.5" y="461" text-anchor="middle" font-size="12.5" fill="#5a6070">local: DWB control</text><text x="717.5" y="478" text-anchor="middle" font-size="12.5" fill="#5a6070">costmaps + recovery</text><rect x="870" y="400" width="250" height="104" rx="9" fill="#ffffff" stroke="#5a6070" stroke-width="2"/><text x="995.0" y="423" text-anchor="middle" font-size="15" font-weight="700" fill="#5a6070">Tools</text><text x="995.0" y="444" text-anchor="middle" font-size="12.5" fill="#5a6070">RViz2 visualisation</text><text x="995.0" y="461" text-anchor="middle" font-size="12.5" fill="#5a6070">rosbag2 record/replay</text><text x="995.0" y="478" text-anchor="middle" font-size="12.5" fill="#5a6070">rqt_graph · tf2_echo</text><line x1="177" y1="344" x2="177" y2="398" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><line x1="447" y1="344" x2="447" y2="398" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><line x1="717" y1="344" x2="717" y2="398" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><line x1="995" y1="344" x2="995" y2="398" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><rect x="420" y="570" width="330" height="78" rx="9" fill="#ffffff" stroke="#2b8a4a" stroke-width="2"/><text x="585.0" y="593" text-anchor="middle" font-size="15" font-weight="700" fill="#2b8a4a">/cmd_vel  (geometry_msgs/Twist)</text><text x="585.0" y="614" text-anchor="middle" font-size="12.5" fill="#5a6070">linear.x  ·  angular.z</text><line x1="717" y1="504" x2="640" y2="568" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><rect x="230" y="700" width="300" height="74" rx="9" fill="#ffffff" stroke="#b8631a" stroke-width="2"/><text x="380.0" y="723" text-anchor="middle" font-size="15" font-weight="700" fill="#b8631a">Gazebo diff drive plugin</text><text x="380.0" y="744" text-anchor="middle" font-size="12.5" fill="#5a6070">simulated motors + odometry</text><rect x="620" y="700" width="320" height="74" rx="9" fill="#ffffff" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="6 4"/><text x="780.0" y="723" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6fd0">Real motor driver</text><text x="780.0" y="744" text-anchor="middle" font-size="12.5" fill="#5a6070">the only node that changes</text><text x="780.0" y="761" text-anchor="middle" font-size="12.5" fill="#5a6070">when moving to hardware</text><line x1="500" y1="648" x2="380" y2="698" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/><line x1="670" y1="648" x2="780" y2="698" stroke="#8a90a0" stroke-width="1.9" marker-end="url(#a)"/>
