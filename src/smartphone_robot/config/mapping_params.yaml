# Parameters loaded by launch/mapping.launch.py for the autonomous explorer.
#
# Structure is fixed by ROS 2 and is easy to get wrong:
#
#   <node_name>:              <- the NODE NAME, i.e. the string passed to
#     ros__parameters:           super().__init__('...'). NOT the package name and
#       <param>: <value>         NOT the executable name. A mismatch here is silent:
#                                the node simply keeps its defaults.
#
# Note the DOUBLE underscore in ros__parameters. A single one is also silent.
# `ros2 param list` is how you check that values actually arrived.

# Exploration speeds used while mapping. Deliberately slow: slam_toolbox takes a keyframe
# every 0.15 m / 0.15 rad, so driving slowly gives it more overlapping views of each
# surface and a visibly sharper map. Fast exploration finishes sooner and maps worse.
wander_node:
  ros__parameters:
    forward_speed: 0.18      # [m/s]
    turn_speed: 0.5          # [rad/s]
    stop_distance: 0.60      # [m]
    clear_distance: 0.95     # [m]
    control_rate: 10.0
