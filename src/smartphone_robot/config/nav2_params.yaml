# Navigation2 configuration for this differential-drive robot.
#
# WHAT NAV2 IS
# ============
# Nav2 is not one algorithm; it is a stack of cooperating servers, each a lifecycle
# node, coordinated by a behaviour tree. Given a goal pose it answers two different
# questions with two different components:
#
#   planner_server      GLOBAL: "what route gets me there?"  Runs on the static map,
#                       a few times per goal. Here: NavFn, an A*/Dijkstra grid search.
#   controller_server   LOCAL:  "what velocity do I send RIGHT NOW?"  Runs at 20 Hz on
#                       the local costmap, following the global route while dodging
#                       obstacles that were not on the map. Here: DWB, which samples
#                       many candidate velocity pairs each cycle, simulates each one
#                       forward, scores them, and publishes the winner to /cmd_vel.
#
# The split matters: a global planner alone cannot react to a chair that was moved
# since the map was made, and a local controller alone gets trapped in dead ends.
#
#   amcl                localises the robot against the saved map by matching laser
#                       scans to it, publishing map -> odom. Same role slam_toolbox
#                       played while mapping, but against a FIXED map.
#   behavior_server     recovery behaviours: spin, back up, wait. Run when the robot
#                       gets stuck, before declaring failure.
#   bt_navigator        the behaviour tree that sequences all of the above.
#
# Every distance below is derived from this robot's real geometry (0.35 x 0.22 m body,
# 0.26 m wheel track, LiDAR at 0.06 m forward and 0.17 m up). They are not generic
# defaults, and on different hardware they must be re-measured.

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Particle filter size. More particles localise more reliably but cost CPU.
    min_particles: 300
    max_particles: 1500

    # Motion noise model: how much the wheel odometry is distrusted. alpha1/2 are
    # rotation error, alpha3/4 translation error. Simulated odometry is cleaner than
    # real, so on hardware these usually need raising.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 60

    # Only resample after the robot has actually moved; resampling while stationary
    # collapses particle diversity and the filter becomes overconfident.
    update_min_a: 0.2
    update_min_d: 0.25
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # slam_toolbox anchors the map frame at the robot's pose when mapping began, so a
    # robot respawned at that same world position starts at (0,0,0) in map. Seeding
    # AMCL with it means the demo runs without a manual "2D Pose Estimate" click; on a
    # real robot you would either click, or use a docking station as a known origin.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # If the robot has not moved 0.5 m in 10 s it is stuck; trigger recovery rather
      # than grinding against an obstacle forever.
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2      # [m]  how close counts as "arrived"
      yaw_goal_tolerance: 0.3     # [rad]
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # Velocity limits. These must be within what the robot can physically do: too
      # high and the controller commands motion the base cannot deliver, so it drifts
      # off the planned path.
      min_vel_x: 0.0
      max_vel_x: 0.26
      min_vel_y: 0.0              # a differential drive cannot move sideways
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2

      # DWB samples vx_samples x vtheta_samples candidate velocities per cycle and
      # simulates each for sim_time seconds.
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Raised from the usual 0.2 s. Gazebo on a laptop does not always hold a
      # real-time factor of 1.0, so transforms can arrive late; at 0.2 s the
      # controller aborts with "Transform data too old" the moment the machine is
      # busy. On real hardware, where the clock is the wall clock, 0.2 is fine.
      transform_tolerance: 0.6
      xy_goal_tolerance: 0.2
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # Each critic scores candidate trajectories; the weights decide the driving
      # style. Raise PathAlign to hug the planned route, raise ObstacleFootprint to
      # give obstacles a wider berth.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom          # local costmap follows the robot, so it lives in odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.6
      rolling_window: true        # a small window that moves with the robot
      width: 3
      height: 3
      resolution: 0.05
      # Circumscribed radius of the 0.35 x 0.22 m chassis, rounded up.
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true          # rays also CLEAR space they pass through
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Obstacles are grown by this radius so the planner keeps the robot's BODY
        # clear, not just its centre point. Without inflation the robot clips corners.
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      transform_tolerance: 0.6
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""      # supplied by the launch file

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false     # false = Dijkstra: slower but finds optimal paths
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ============================================================================
# Servers that nav2_bringup starts on Jazzy in addition to the classic stack.
# Each is a lifecycle node, and the lifecycle manager ABORTS THE WHOLE BRINGUP if any
# one of them fails to configure. Leaving these out is not "using defaults" -- it
# leaves required parameters uninitialised, and navigation never comes up at all.
# ============================================================================

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    # The last safety net in the velocity chain:
    #   controller_server -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel_smoothed
    #   -> collision_monitor -> /cmd_vel -> the robot
    # It watches raw laser data independently of the costmaps, so it still stops the
    # robot if the planner's world model is wrong. On real hardware this layer is what
    # stands between a mapping bug and a physical collision.
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    # Also raised: the collision monitor stops the robot outright when laser data
    # looks stale, and under simulator lag that fires constantly ("Robot to stop due
    # to invalid source"), which looks exactly like a navigation failure.
    transform_tolerance: 0.6
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      # Projects the robot's footprint forward along the commanded velocity; if it
      # would hit something within this many seconds, the command is scaled down.
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      # Ignore returns below 0.15 m so the floor is never mistaken for an obstacle.
      min_height: 0.15
      max_height: 2.0
      enabled: true

docking_server:
  ros__parameters:
    use_sim_time: true
    # Unused by this project -- there is no charging dock -- but it must be configured
    # or the bringup aborts. Kept at defaults, with this robot's frames.
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

route_server:
  ros__parameters:
    use_sim_time: true
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
